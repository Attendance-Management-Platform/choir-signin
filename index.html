<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in probe</title>
<style>body{font:16px system-ui;margin:16px;max-width:36rem}button{font:inherit;padding:.6rem 1rem;margin:.3rem 0}pre{background:#eee;padding:.6rem;white-space:pre-wrap}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}pre{background:#222}}</style></head>
<body><h1>Check-in probe</h1>
<p>Tests only what this browser allows. Nothing is sent or stored. Location is read once and shown here, never saved.</p>
<button id="g">Test location</button><pre id="go">not run</pre>
<button id="c">Test camera</button><pre id="co">not run</pre>
<script>
document.getElementById('g').onclick=()=>{const o=document.getElementById('go');
 if(!navigator.geolocation){o.textContent='NO: geolocation not available';return}
 navigator.geolocation.getCurrentPosition(p=>o.textContent='YES: accuracy about '+Math.round(p.coords.accuracy)+' m',e=>o.textContent='NO: '+e.message,{enableHighAccuracy:true,timeout:15000});};
document.getElementById('c').onclick=async()=>{const o=document.getElementById('co');
 try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());o.textContent='YES: camera allowed'}catch(e){o.textContent='NO: '+e.name+' '+e.message}};
</script></body></html>
